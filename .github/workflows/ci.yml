name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: [self-hosted, hero]
    steps:
      - uses: actions/checkout@v4

      - name: Show runner toolchain
        run: |
          hostname
          python3 --version
          node --version || true
          docker --version || true

      - name: Z49 marker
        run: |
          id
          hostname
          echo Z49-MARKER-$(date -u +%s)

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -e '.[dev,devices]'

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -q
